# Continuous integration for the book. Runs the fast, tool-light checks on every
# push and PR: Vale (prose) and the pytest invariants (structure + scripts).
#
# The full build (Pandoc -> EPUB/DOCX and the `build`-marked tests) is heavier
# and left as a manual/opt-in step; uncomment the build job to run it in CI once
# you are ready to pay the minutes.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: python -m pip install -r requirements-dev.txt

      - name: Fast tests (structure + scripts)
        run: python -m pytest -m "not build"

      - name: Vale prose lint
        uses: errata-ai/vale-action@reviewdog
        with:
          files: manuscript
          fail_on_error: true
          # Reads .vale.ini and runs `vale sync` for the style packages.

