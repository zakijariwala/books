StylesPath = styles

# Custom project vocabulary lives in styles/config/vocabularies/Book/.
# Add technical terms and proper nouns to accept.txt as they surface, rather
# than rewording around Vale's dictionary.
Vocab = Book

# Style packages, fetched by `vale sync` into styles/. They are NOT committed:
# see styles/README.md. Google is a solid general prose style; write-good and
# proselint catch weak and lazy writing. Swap or drop any that do not suit you.
Packages = Google, write-good, proselint

[manuscript/*.md]
BasedOnStyles = Vale, Google, write-good, proselint

# --- Book-vs-documentation overrides --------------------------------------
# The Google package encodes Google's *documentation* house style, which fights
# ordinary book convention in a few places. Each rule below is disabled with the
# reason. Review this list for your own book: keep what helps, re-enable what
# you disagree with. These are defaults, not commandments.

# Google.Headings demands sentence-case headings; most books use title case.
Google.Headings = NO

# Flags the word "Chapter" among others as needing a specific case.
Google.WordListCase = NO

# First person is correct in a book preface and in author asides.
Google.FirstPerson = NO

# A book that addresses its reader directly wants "you". "We" bans are for docs.
Google.We = NO

# Em-dash spacing is a house-style choice. Google closes them up; spaced dashes
# are normal in book typography. Pick one and keep it consistent; disabled here
# so the rule does not fight whichever you choose.
Google.EmDash = NO
