StylesPath = styles

Vocab = Book

Packages = Google, write-good, proselint

[manuscript/*.md]
BasedOnStyles = Vale, Google, write-good, proselint

# Google's package encodes its documentation house style, not book style.
# These two rules fight standard book convention on every chapter heading.
Google.Headings = NO
Google.WordListCase = NO

# First person is correct in a book preface and in author asides.
Google.FirstPerson = NO

# An exam-prep book names its audience directly. "You" is the house voice.
Google.We = NO

# Google sets em dashes closed up. This book sets them spaced, which is normal
# British book typography and reads better at 6x9 in a serif face.
Google.EmDash = NO

# "Commas and periods go inside quotation marks" is US convention. The book is
# written in British English throughout (datacentre, optimised, utilisation),
# and British practice puts punctuation outside unless it belongs to the quote.
# Enforcing the US rule here would contradict the rest of the house style.
Google.Quotes = NO

# The rule catches hyphenated -ly adverbs, which is right in general. It also
# catches "exactly-once", which is a term of art in stream processing and is
# hyphenated everywhere the concept is discussed.
Google.LyHyphens = NO
