StylesPath = .vale/styles

# Warning, never error. These rules are advisory: the author overrules them.
MinAlertLevel = warning

# The Book style is written by hand from the CLAUDE.md voice rules. It pulls no
# packages, so `vale sync` is not needed and the linter works offline.
#
# Only prose gets linted. docs/, prompts/, TASKS.md, HANDOVER.md, and
# voice/BRIEF.md are working documents, not writing, and they are left alone by
# having no section here. voice/reference-article.md is the author's own writing
# and sets the target register, so linting it would be backwards.

[manuscript/*.md]
BasedOnStyles = Book

[articles/*.md]
BasedOnStyles = Book

[voice/pilot-*.md]
BasedOnStyles = Book

[voice/sample.md]
BasedOnStyles = Book
# The transcript is talk, not written prose. Adverbs and throat-clearing are how
# people speak, and the whole point of the sample is that it stays untidied.
Book.Adverbs = NO
Book.ExamPrep = NO
