[pytest]
testpaths = tests
# scripts/ holds the modules under test; the Makefile exports PYTHONPATH too,
# but setting it here means a bare `pytest` works without the Makefile.
pythonpath = scripts
markers =
    build: needs a built book in build/, and therefore Pandoc. Slow; excluded
        from the pre-commit hook and run by `make test-build`.
addopts = -q --strict-markers
