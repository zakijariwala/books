<rect x="96.0" y="128.0" width="700.0" height="62.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
<rect x="736.0" y="128.0" width="60.0" height="62.0" rx="3" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2.2"/>
